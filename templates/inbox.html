<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVNIT Academic Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-sky-800 text-white flex items-center justify-center font-bold text-sm rounded-md shadow-sm">
                    SV
                </div>
                <div>
                    <h1 class="font-semibold text-slate-900 leading-none">SVNIT Network</h1>
                    <span class="text-xs text-sky-700 font-medium">Direct Messages</span>
                </div>
            </div>

            <!-- User Info & Logout -->
            <div class="flex items-center space-x-4">
                <p class="text-xs font-medium text-slate-900 hidden sm:block">{{ name }}</p>
                <a 
                    href="/logout" 
                    class="border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-md transition"
                >
                    Sign Out
                </a>
            </div>
        </div>
    </header>

    <!-- Main Body -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full flex flex-col">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 flex-grow">
            
            <!-- Left Column: Navigation & Users List -->
            <div class="space-y-4 md:col-span-1 flex flex-col">
                <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Navigation</h2>
                    <nav class="space-y-1">
                        <a href="/dashboard" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-50 text-slate-700 text-sm transition">
                            <span>Q&A Feed</span>
                        </a>
                        <a href="/inbox" class="flex items-center space-x-3 px-3 py-2 rounded-md bg-sky-50 text-sky-800 font-medium text-sm">
                            <span>Direct Messaging Inbox</span>
                        </a>
                    </nav>
                </div>

                <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm flex-grow flex flex-col">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">SVNIT Peers</h2>
                    <div id="users-list" class="space-y-1 overflow-y-auto max-h-[350px]">
                        <p class="text-xs text-slate-400">Loading peers...</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Chat Window -->
            <div class="md:col-span-3 bg-white border border-slate-200 rounded-lg shadow-sm flex flex-col h-[600px]">
                
                <!-- Chat Header -->
                <div id="chat-header" class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 rounded-t-lg">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Select a peer from the left to start messaging</span>
                </div>

                <!-- Messages Container -->
                <div id="chat-messages" class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50/50">
                    <div class="flex items-center justify-center h-full text-xs text-slate-400">
                        No conversation selected.
                    </div>
                </div>

                <!-- Message Input Form -->
                <form id="chat-form" class="p-4 border-t border-slate-200 bg-white rounded-b-lg hidden flex space-x-2">
                    <input type="hidden" id="active-recipient-email">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type a secure message..." 
                        required
                        class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-700"
                    >
                    <button 
                        type="submit" 
                        class="bg-sky-800 hover:bg-sky-900 text-white font-medium px-4 py-2 rounded-lg text-xs transition shadow-sm"
                    >
                        Send
                    </button>
                </form>

            </div>

        </div>
    </main>

    <script>
        const myEmail = "{{ email }}";
        let activePeerEmail = null;
        let activePeerName = null;

        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const users = await res.json();
                const list = document.getElementById('users-list');

                if (users.length === 0) {
                    list.innerHTML = `<p class="text-xs text-slate-400 py-2">No other peers registered yet.</p>`;
                    return;
                }

                list.innerHTML = users.map(u => `
                    <button 
                        onclick="selectPeer('${u.email}', '${u.name}', '${u.department}')"
                        class="w-full text-left p-2 rounded-md hover:bg-slate-50 transition border border-transparent hover:border-slate-200 space-y-0.5"
                    >
                        <p class="font-semibold text-xs text-slate-900">${u.name}</p>
                        <p class="text-[10px] text-sky-700 font-medium">${u.department}</p>
                    </button>
                `).join('');
            } catch (err) {
                console.error("Failed to load users:", err);
            }
        }

        async function selectPeer(email, name, department) {
            activePeerEmail = email;
            activePeerName = name;

            document.getElementById('chat-header').innerHTML = `
                <div>
                    <h2 class="font-bold text-sm text-slate-900">${name}</h2>
                    <span class="text-[11px] text-sky-700 font-medium">${department}</span>
                </div>
            `;
            document.getElementById('chat-form').classList.remove('hidden');
            loadMessages();
        }

        async function loadMessages() {
            if (!activePeerEmail) return;
            try {
                const res = await fetch(`/api/messages/${activePeerEmail}`);
                const messages = await res.json();
                const container = document.getElementById('chat-messages');

                if (messages.length === 0) {
                    container.innerHTML = `<div class="flex items-center justify-center h-full text-xs text-slate-400">No messages yet with ${activePeerName}. Start the conversation!</div>`;
                    return;
                }

                container.innerHTML = messages.map(m => {
                    const isMe = m.sender_email === myEmail;
                    return `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <div class="max-w-md rounded-lg p-3 text-sm ${isMe ? 'bg-sky-800 text-white' : 'bg-white border border-slate-200 text-slate-800 shadow-sm'}">
                                <p class="whitespace-pre-line">${m.content}</p>
                            </div>
                            <span class="text-[10px] text-slate-400 mt-1">${m.timestamp}</span>
                        </div>
                    `;
                }).join('');
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error("Failed to load messages:", err);
            }
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value;

            if (!activePeerEmail || !content.trim()) return;

            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipient_email: activePeerEmail, content })
            });

            if (res.ok) {
                input.value = '';
                loadMessages();
            }
        });

        // Load users on startup
        loadUsers();
        // Poll for new messages every 5 seconds
        setInterval(loadMessages, 5000);
    </script>
</body>
</html>
