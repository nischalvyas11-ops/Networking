<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messaging Inbox - SVNIT Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col" data-user-email="{{ email }}">

    <!-- Top Navigation -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-sky-800 text-white flex items-center justify-center font-bold text-sm rounded-md shadow-sm">
                    SV
                </div>
                <div>
                    <h1 class="font-semibold text-slate-900 leading-none">SVNIT Network</h1>
                    <span class="text-xs text-sky-700 font-medium">Direct Messaging</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <p class="text-xs font-medium text-slate-900 hidden sm:block">{{ name }}</p>
                <a href="/logout" class="border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-md transition">
                    Sign Out
                </a>
            </div>
        </div>
    </header>

    <!-- Main Body -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-[calc(100vh-10rem)]">
            
            <!-- Left Column: Navigation & User List -->
            <div class="space-y-4 flex flex-col h-full">
                <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Platform Navigation</h2>
                    <nav class="space-y-1">
                        <a href="/dashboard" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-50 text-slate-700 text-sm transition border-l-4 border-transparent">
                            <span>Q&A Feed</span>
                        </a>
                        <a href="/inbox" class="flex items-center space-x-3 px-3 py-2 rounded-r-md bg-sky-50 text-sky-800 font-medium text-sm border-l-4 border-sky-800 transition">
                            <span>Direct Messaging Inbox</span>
                        </a>
                        <a href="/profile" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-50 text-slate-700 text-sm transition border-l-4 border-transparent">
                            <span>My Profile & Bio</span>
                        </a>
                    </nav>
                </div>

                <!-- Peer Directory -->
                <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm flex-grow flex flex-col min-h-0">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Select a Student</h2>
                    <div id="users-list" class="space-y-1 overflow-y-auto flex-grow pr-1">
                        <p class="text-xs text-slate-400 py-2">Loading students...</p>
                    </div>
                </div>
            </div>

            <!-- Center/Right Column: Chat Window -->
            <div class="md:col-span-2 bg-white border border-slate-200 rounded-lg shadow-sm flex flex-col h-full overflow-hidden">
                
                <!-- Chat Header -->
                <div class="p-4 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
                    <div>
                        <h2 id="active-peer-name" class="text-sm font-semibold text-slate-900">Select a peer to start messaging</h2>
                        <span id="active-peer-info" class="text-xs text-sky-700 font-medium hidden"></span>
                    </div>
                </div>

                <!-- Chat Messages Feed (Scrollable) -->
                <div id="chat-messages" class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50/30">
                    <div class="h-full flex items-center justify-center text-xs text-slate-400">
                        Choose a student from the sidebar to view your conversation.
                    </div>
                </div>

                <!-- Message Input Box -->
                <form id="message-form" class="p-4 border-t border-slate-200 bg-white flex space-x-2">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type a direct message..." 
                        disabled
                        required
                        class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-700 focus:border-transparent disabled:bg-slate-100 disabled:cursor-not-allowed"
                    />
                    <button 
                        type="submit" 
                        id="send-btn" 
                        disabled
                        class="bg-sky-800 hover:bg-sky-900 disabled:bg-slate-300 text-white font-medium px-4 py-2 rounded-lg text-xs transition shadow-sm"
                    >
                        Send
                    </button>
                </form>

            </div>

        </div>
    </main>

    <!-- JavaScript to handle direct messaging with chat bubbles -->
    <script>
        const myEmail = document.body.getAttribute('data-user-email');
        let activePeerEmail = null;

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                const list = document.getElementById('users-list');

                if (users.length === 0) {
                    list.innerHTML = `<p class="text-xs text-slate-400 py-2">No other students registered yet.</p>`;
                    return;
                }

                list.innerHTML = users.map(u => `
                    <button 
                        onclick="selectUser('${u.email}', '${u.name}', '${u.department}', '${u.batch}')"
                        class="w-full text-left p-2.5 rounded-md hover:bg-slate-50 transition text-xs border border-transparent hover:border-slate-200 user-btn"
                        id="user-btn-${u.email.replace(/[@.]/g, '-')}"
                    >
                        <div class="font-semibold text-slate-800">${u.name}</div>
                        <div class="text-[10px] text-sky-700 font-medium">${u.department} (${u.batch})</div>
                    </button>
                `).join('');
            } catch (err) {
                console.error('Failed to load user list:', err);
            }
        }

        function selectUser(email, name, department, batch) {
            activePeerEmail = email;

            // Update UI Header
            document.getElementById('active-peer-name').innerText = name;
            const infoTag = document.getElementById('active-peer-info');
            infoTag.innerText = `${department} • Batch ${batch}`;
            infoTag.classList.remove('hidden');

            // Enable form controls
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;

            // Highlight selected button
            document.querySelectorAll('.user-btn').forEach(btn => btn.classList.remove('bg-sky-50', 'border-sky-200'));
            const activeBtn = document.getElementById(`user-btn-${email.replace(/[@.]/g, '-')}`);
            if (activeBtn) activeBtn.classList.add('bg-sky-50', 'border-sky-200');

            loadMessages();
        }

        async function loadMessages() {
            if (!activePeerEmail) return;

            try {
                const response = await fetch(`/api/messages/${activePeerEmail}`);
                const messages = await response.json();
                const chatFeed = document.getElementById('chat-messages');

                if (messages.length === 0) {
                    chatFeed.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-center space-y-2">
                            <p class="text-xs font-medium text-slate-500">No previous messages</p>
                            <p class="text-[11px] text-slate-400">Send a message below to start chatting!</p>
                        </div>
                    `;
                    return;
                }

                chatFeed.innerHTML = messages.map(m => {
                    const isMine = m.sender_email === myEmail;
                    return `
                        <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
                            <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-xs shadow-sm ${
                                isMine 
                                    ? 'bg-sky-800 text-white rounded-br-none' 
                                    : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
                            }">
                                <p class="whitespace-pre-line">${m.content}</p>
                            </div>
                            <span class="text-[9px] text-slate-400 mt-1 px-1">${m.timestamp}</span>
                        </div>
                    `;
                }).join('');

                // Scroll to bottom of chat
                chatFeed.scrollTop = chatFeed.scrollHeight;
            } catch (err) {
                console.error('Failed to load messages:', err);
            }
        }

        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activePeerEmail) return;

            const input = document.getElementById('message-input');
            const content = input.value;

            const response = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    recipient_email: activePeerEmail,
                    content: content
                })
            });

            if (response.ok) {
                input.value = '';
                loadMessages();
            }
        });

        loadUsers();
    </script>
</body>
</html>
