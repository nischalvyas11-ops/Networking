<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVNIT Network — Campus Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar hiding for horizontal filters */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased min-h-screen flex flex-col pb-16 md:pb-0" data-user-email="{{ email }}">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-sky-900 text-white font-semibold text-xs flex items-center justify-center rounded">
                    SV
                </div>
                <div>
                    <span class="font-semibold text-sm tracking-tight text-slate-900 block leading-tight">SVNIT Network</span>
                    <span class="text-[11px] text-sky-700 font-medium">{{ department }} • Batch {{ batch }}</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <span class="text-xs font-medium text-slate-700 hidden sm:inline">{{ name }}</span>
                <a href="/logout" class="text-xs font-medium text-slate-600 hover:text-slate-900 px-2.5 py-1 rounded border border-slate-200 hover:bg-slate-50 transition">
                    Sign Out
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            
            <!-- Desktop Sidebar Navigation (Hidden on Mobile) -->
            <aside class="hidden md:block md:col-span-1 space-y-4">
                <nav class="bg-white border border-slate-200 rounded-lg p-2 space-y-0.5 shadow-sm">
                    <a href="/dashboard" class="flex items-center space-x-2.5 px-3 py-2 rounded bg-sky-50 text-sky-900 font-medium text-xs">
                        <svg class="w-4 h-4 text-sky-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                        <span>Q&A Feed</span>
                    </a>
                    <a href="/inbox" class="flex items-center space-x-2.5 px-3 py-2 rounded text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-xs transition">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                        <span>Messages</span>
                    </a>
                    <a href="/profile" class="flex items-center space-x-2.5 px-3 py-2 rounded text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-xs transition">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span>My Profile</span>
                    </a>
                </nav>
            </aside>

            <!-- Main Feed & Composer Column -->
            <section class="md:col-span-3 space-y-5">
                
                <!-- Compact Question Composer -->
                <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
                    <form id="question-form" class="space-y-3">
                        <textarea 
                            id="question-content" 
                            rows="2" 
                            placeholder="Ask an academic or project-related question..." 
                            required
                            class="w-full border border-slate-200 rounded-md p-2.5 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-sky-800 focus:border-sky-800 resize-none"
                        ></textarea>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-slate-400 hidden sm:inline">Visible to all verified SVNIT students</span>
                            <button type="submit" class="bg-sky-900 hover:bg-sky-950 text-white font-medium px-3.5 py-1.5 rounded text-xs transition shadow-sm">
                                Post Question
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Horizontally Scrollable Department Filters -->
                <div class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-1">
                    <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-sky-900 text-white whitespace-nowrap transition">All Posts</button>
                    <button onclick="setFilter('Artificial Intelligence')" id="filter-Artificial Intelligence" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300 whitespace-nowrap transition">AI</button>
                    <button onclick="setFilter('Electronics and Communication')" id="filter-Electronics and Communication" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300 whitespace-nowrap transition">ECE</button>
                    <button onclick="setFilter('Electrical Engineering')" id="filter-Electrical Engineering" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300 whitespace-nowrap transition">EE</button>
                    <button onclick="setFilter('Computer Science')" id="filter-Computer Science" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300 whitespace-nowrap transition">CSE</button>
                    <button onclick="setFilter('my-posts')" id="filter-my-posts" class="filter-btn px-3 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300 whitespace-nowrap transition">My Posts</button>
                </div>

                <!-- Questions Feed Container -->
                <div class="space-y-3" id="questions-feed">
                    <div class="bg-white border border-slate-200 rounded-lg p-8 text-center text-xs text-slate-400">
                        Loading questions...
                    </div>
                </div>

            </section>

        </div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 flex justify-around items-center h-14 px-2 shadow-lg">
        <a href="/dashboard" class="flex flex-col items-center justify-center flex-1 py-1 text-sky-900">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
            <span class="text-[10px] font-medium mt-0.5">Feed</span>
        </a>
        <a href="/inbox" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            <span class="text-[10px] font-medium mt-0.5">Messages</span>
        </a>
        <a href="/profile" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[10px] font-medium mt-0.5">Profile</span>
        </a>
    </nav>

    <!-- Frontend Script Logic -->
    <script>
        const currentUserEmail = document.body.getAttribute('data-user-email');
        let allQuestions = [];
        let currentFilter = 'all';

        async function loadQuestions() {
            try {
                const response = await fetch('/api/questions');
                allQuestions = await response.json();
                renderFeed();
            } catch (err) {
                console.error('Failed to load questions:', err);
            }
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            
            // Update filter pill styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-3 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-350 whitespace-nowrap transition";
            });
            const activeBtn = document.getElementById(`filter-${filterType}`);
            if (activeBtn) {
                activeBtn.className = "filter-btn px-3 py-1 rounded-full text-xs font-medium bg-sky-900 text-white whitespace-nowrap transition";
            }
            
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('questions-feed');
            
            let filtered = allQuestions;
            if (currentFilter === 'my-posts') {
                filtered = allQuestions.filter(q => q.user_email === currentUserEmail);
            } else if (currentFilter !== 'all') {
                filtered = allQuestions.filter(q => q.department === currentFilter);
            }

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-lg p-8 text-center space-y-2 shadow-sm">
                        <p class="text-xs font-semibold text-slate-700">No questions found</p>
                        <p class="text-[11px] text-slate-400">Be the first to start a discussion in this category!</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filtered.map(q => {
                const isAuthor = q.user_email === currentUserEmail;
                return `
                    <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm space-y-2.5">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="font-semibold text-xs text-slate-900">${q.user_name}</span>
                                <span class="text-slate-300">•</span>
                                <span class="text-[11px] text-sky-700 font-medium">${q.department} (${q.batch})</span>
                            </div>
                            <div class="flex items-center space-x-2.5">
                                <span class="text-[10px] text-slate-400">${q.timestamp}</span>
                                ${isAuthor ? `<button onclick="deleteQuestion(${q.id})" class="text-[11px] text-red-600 hover:underline font-medium">Delete</button>` : ''}
                            </div>
                        </div>
                        <p class="text-xs text-slate-800 leading-relaxed whitespace-pre-line">${q.content}</p>
                    </div>
                `;
            }).join('');
        }

        async function deleteQuestion(id) {
            if (!confirm("Are you sure you want to delete this question?")) return;
            const response = await fetch(`/api/questions/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadQuestions();
            } else {
                alert("Failed to delete question.");
            }
        }

        document.getElementById('question-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('question-content').value;

            const response = await fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            if (response.ok) {
                document.getElementById('question-content').value = '';
                loadQuestions();
            }
        });

        loadQuestions();
    </script>
</body>
</html>
