<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVNIT Academic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col" data-user-email="{{ email }}">

    <!-- Top Navigation -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-sky-800 text-white flex items-center justify-center font-bold text-sm rounded-md shadow-sm">
                    SV
                </div>
                <div>
                    <h1 class="font-semibold text-slate-900 leading-none">SVNIT Network</h1>
                    <span class="text-xs text-sky-700 font-medium">{{ department }} • Batch {{ batch }}</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <p class="text-xs font-medium text-slate-900 hidden sm:block">{{ name }}</p>
                <a href="/logout" class="border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-md transition">
                    Sign Out
                </a>
            </div>
        </div>
    </header>

    <!-- Main Body -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Left Column: Polished Navigation -->
            <div class="space-y-4">
                <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Platform Navigation</h2>
                    <nav class="space-y-1">
                        <a href="/dashboard" class="flex items-center space-x-3 px-3 py-2 rounded-r-md bg-sky-50 text-sky-800 font-medium text-sm border-l-4 border-sky-800 transition">
                            <span>Q&A Feed</span>
                        </a>
                        <a href="/inbox" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-50 text-slate-700 text-sm transition border-l-4 border-transparent">
                            <span>Direct Messaging Inbox</span>
                        </a>
                        <a href="/profile" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-50 text-slate-700 text-sm transition border-l-4 border-transparent">
                            <span>My Profile & Bio</span>
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Center/Right Column: Q&A Feed -->
            <div class="md:col-span-2 space-y-6">
                
                <!-- Post Question Card -->
                <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-4">
                    <h2 class="text-sm font-semibold text-slate-900">Ask the Academic Community</h2>
                    <form id="question-form" class="space-y-3">
                        <textarea 
                            id="question-content" 
                            rows="3" 
                            placeholder="Type your academic or project-related question here..." 
                            required
                            class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-700 focus:border-transparent resize-none"
                        ></textarea>
                        <div class="flex justify-end">
                            <button type="submit" class="bg-sky-800 hover:bg-sky-900 text-white font-medium px-4 py-2 rounded-lg text-xs transition shadow-sm">
                                Post Question
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Questions Feed -->
                <div class="space-y-4" id="questions-feed">
                    <p class="text-xs text-slate-400 text-center py-4">Loading questions...</p>
                </div>

            </div>

        </div>
    </main>

    <!-- JavaScript to handle live feed posting, loading & deletion -->
    <script>
        const currentUserEmail = document.body.getAttribute('data-user-email');

        async function loadQuestions() {
            try {
                const response = await fetch('/api/questions');
                const questions = await response.json();
                const feed = document.getElementById('questions-feed');
                
                if (questions.length === 0) {
                    feed.innerHTML = `
                        <div class="bg-white border border-slate-200 rounded-lg p-10 text-center space-y-3 shadow-sm">
                            <div class="w-12 h-12 bg-sky-50 text-sky-800 rounded-full flex items-center justify-center mx-auto">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                                </svg>
                            </div>
                            <p class="text-sm font-semibold text-slate-700">No questions posted yet</p>
                            <p class="text-xs text-slate-400">Be the first to start a discussion with the academic community!</p>
                        </div>
                    `;
                    return;
                }

                feed.innerHTML = questions.map(q => {
                    const isAuthor = q.user_email === currentUserEmail;
                    return `
                        <div class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="font-semibold text-xs text-slate-900">${q.user_name}</span>
                                    <span class="text-slate-300">•</span>
                                    <span class="text-[11px] text-sky-700 font-medium">${q.department} (${q.batch})</span>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <span class="text-[10px] text-slate-400">${q.timestamp}</span>
                                    ${isAuthor ? `<button onclick="deleteQuestion(${q.id})" class="text-[11px] text-red-600 hover:underline font-medium">Delete</button>` : ''}
                                </div>
                            </div>
                            <p class="text-sm text-slate-700 whitespace-pre-line">${q.content}</p>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to load questions:', err);
            }
        }

        async function deleteQuestion(id) {
            if (!confirm("Are you sure you want to delete this question?")) return;
            const response = await fetch(`/api/questions/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadQuestions();
            } else {
                alert("Failed to delete question.");
            }
        }

        document.getElementById('question-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('question-content').value;

            const response = await fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            if (response.ok) {
                document.getElementById('question-content').value = '';
                loadQuestions();
            }
        });

        loadQuestions();
    </script>
</body>
</html>
