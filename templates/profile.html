<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SVNIT Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-2xl mx-auto py-10 px-4">
        <div class="bg-white shadow rounded-lg p-6">
            <!-- User Header -->
            <div class="flex items-center space-x-4">
                {% if user.avatar_url %}
                    <img src="{{ user.avatar_url }}" alt="Profile Picture" class="w-20 h-20 rounded-full border-2 border-blue-500 object-cover">
                {% else %}
                    <div class="w-20 h-20 rounded-full bg-blue-500 text-white flex items-center justify-center text-2xl font-bold">
                        {{ user.name[0] }}
                    </div>
                {% endif %}
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">{{ user.name }}</h1>
                    <p class="text-gray-600">{{ user.email }}</p>
                    <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded mt-1">
                        {{ user.department }} | Batch of {{ user.batch }}
                    </span>
                </div>
            </div>
            
            <hr class="my-6">

            <!-- Bio Update Form -->
            <h2 class="text-lg font-semibold text-gray-700 mb-2">My Bio</h2>
            <form action="/profile/update-bio" method="POST" class="space-y-4">
                <textarea name="bio" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Write a short bio about your interests, projects, or tech stack...">{{ user.bio }}</textarea>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Save Bio</button>
            </form>

            <div class="mt-6">
                <a href="/dashboard" class="text-blue-600 hover:underline">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
